<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanger purchase planner</title>
<link rel="stylesheet" href="/planner.css">
<style>
  /* Hanger-specific only — everything else is in /planner.css. */
  tr.buy td:first-child{border-left:3px solid var(--warn)}
  table.buy{table-layout:fixed}
  table.buy col.c-sku{width:240px}
  table.buy col.c-need{width:90px}
  table.buy col.c-have{width:90px}
  table.buy col.c-buy{width:110px}
  table.buy col.c-inc{width:110px}
  table.buy col.c-thresh{width:90px}
  table.buy col.c-status{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <nav class="nav" aria-label="Planner switch"><a href="/">EWP</a><a href="/plates">Plates</a><a href="/hangers" class="on">Hangers</a><a href="/lvl">LVL</a></nav>
    <h1 style="margin-top:14px">Hanger Purchase Planner</h1>
    <p class="sub">Multi-job hanger and hardware demand consolidated and netted against stock.</p>
  </div>

  <div id="drop-mount"></div>

  <div class="row">
    <button id="btn-plan" disabled>Work out what to buy</button>
    <button id="btn-clear" class="ghost" style="display:none">Clear</button>
    <span class="sub" id="msg"></span>
    <span id="busy" style="display:none;color:var(--muted)">Analyzing hardware requirements…</span>
  </div>

  <div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
</div>

<script src="/planner-ui.js"></script>
<script>
(() => {
  const { esc, fmtInt: fmt, renderStats, renderWarnings } = PlannerUI;
  const el = (id) => document.getElementById(id);
  const btnPlan = el('btn-plan'), btnClear = el('btn-clear'), busy = el('busy');
  const msg = el('msg'), out = el('out');

  // Sniff a hanger stock file (sku/item + available/on_hand/qty, no span, no
  // material name) vs a MiTek material summary.
  function isStockFile(text) {
    const head = String(text || '').slice(0, 1024).toLowerCase();
    return (head.includes('sku') || head.includes('item')) &&
           (head.includes('available') || head.includes('on_hand') || head.includes('qty')) &&
           !head.includes('span') && !head.includes('material name');
  }

  const dz = PlannerUI.dropZones({
    mount: el('drop-mount'),
    jobsTitle: 'Job material summaries',
    jobsHint: 'Drop several, or click to choose. One per job.',
    stockTitle: 'Hanger stock CSV',
    stockHint: 'Stock → Hangers → Export CSV.',
    isStockFile,
    onChange() {
      btnPlan.disabled = dz.isEmpty();
      btnClear.style.display = (!dz.isEmpty() || dz.getStock()) ? 'inline-block' : 'none';
    },
  });

  btnClear.addEventListener('click', () => {
    dz.clear();
    msg.innerHTML = '';
    out.innerHTML = '';
  });

  btnPlan.addEventListener('click', async () => {
    msg.innerHTML = '';
    out.innerHTML = '';
    busy.style.display = 'inline';
    btnPlan.disabled = true;

    try {
      const res = await fetch('/api/hangers/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: dz.getJobs(), stock: dz.getStock() }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        msg.innerHTML = `<div class="note bad">${esc(data.error || 'Failed to analyze hanger files.')}</div>`;
        return;
      }
      renderPlan(data);
    } catch (err) {
      msg.innerHTML = `<div class="note bad">Request failed: ${esc(err.message)}</div>`;
    } finally {
      busy.style.display = 'none';
      btnPlan.disabled = dz.isEmpty();
    }
  });

  function renderPlan(p) {
    const sum = p.summary;
    const hasStock = p.hasStock;
    let html = '';

    if (p.rerouted && p.rerouted.length) {
      html += `<div class="note ok">Auto-detected <b>${esc(p.rerouted.map(r=>r.name).join(', '))}</b> as the hanger stock file.</div>`;
    }
    if (p.stockError) {
      html += `<div class="note bad"><b>Stock file not read:</b> ${esc(p.stockError)}<br>Planned as if the yard were empty — every hanger shows as a buy.</div>`;
    } else if (!hasStock) {
      html += '<div class="note"><b>No stock file.</b> Everything below is a full buy, not a shortfall.</div>';
    } else {
      html += `<div class="note ok"><b>Stock:</b> ${esc(p.stockFileName || 'file')}</div>`;
    }
    html += renderWarnings(p.warnings);

    // Stats bar. The stock-derived cards (Incoming on PO, Special Order) only
    // appear when a stock file is loaded — with no stock they read 0/blank and
    // mean nothing.
    const stats = [
      { label: 'Jobs', value: fmt(sum.jobsCount) },
      { label: 'SKUs Needed', value: fmt(sum.skusNeeded) },
      { label: 'SKUs to Buy', value: fmt(sum.skusToBuy) },
      { label: 'Pieces to Buy', value: fmt(sum.totalBuyPieces), warn: true },
    ];
    if (hasStock) {
      stats.push({ label: 'Incoming on PO', value: fmt(sum.totalIncomingPieces) });
      if (sum.skusUnmatched > 0) stats.push({ label: 'Special Order', value: fmt(sum.skusUnmatched), warn: true });
    }
    html += renderStats(stats);

    // Buy list. Without a stock file this is a plain demand list (SKU / Need /
    // Buy); the Avail, On PO and Min columns only appear when there's stock to
    // net against.
    if (p.buyList.length > 0) {
      const colgroup = hasStock
        ? '<col class="c-sku"><col class="c-need"><col class="c-have"><col class="c-buy"><col class="c-inc"><col class="c-thresh"><col class="c-status">'
        : '<col class="c-sku"><col class="c-need"><col class="c-buy">';
      const span = hasStock ? 7 : 3;
      html += `
        <div>
          <div class="row" style="justify-content:space-between;margin-top:0">
            <div class="eyebrow" style="margin:0">Buy list — ${p.buyList.length} SKU(s)</div>
            <button class="ghost" id="btn-toggle-drills" style="padding:4px 12px;font-size:12.5px">Expand all</button>
          </div>
          <div class="tw">
            <table class="buy">
              <colgroup>${colgroup}</colgroup>
              <thead>
                <tr>
                  <th>SKU</th>
                  <th class="n">Need</th>
                  ${hasStock ? '<th class="n">Avail</th>' : ''}
                  <th class="n">Buy (Pcs)</th>
                  ${hasStock ? '<th class="n">On PO</th><th class="n">Min</th><th>Notes</th>' : ''}
                </tr>
              </thead>
              <tbody>
      `;

      p.buyList.forEach((row, idx) => {
        const isNeg = row.availableRaw != null && row.availableRaw < 0;
        const availCls = row.available === 0 || row.available == null ? 'zero-ink' : '';
        const incCls = row.incoming === 0 ? 'zero-ink' : '';
        const minCls = row.threshold === 0 ? 'zero-ink' : '';

        html += `
          <tr class="buy" data-idx="${idx}">
            <td>
              <span class="caret" data-toggle="${idx}">▸</span><span class="mono"><b>${esc(row.sku)}</b></span>
              ${isNeg ? `<span class="chip neg">${row.availableRaw} in ledger</span>` : ''}
            </td>
            <td class="n">${fmt(row.demand)}</td>
            ${hasStock ? `<td class="n ${availCls}">${row.available != null ? fmt(row.available) : '—'}</td>` : ''}
            <td class="n"><strong style="color:var(--warn)">${fmt(row.buyPieces)}</strong></td>
            ${hasStock ? `
              <td class="n ${incCls}">${row.incoming ? `+${fmt(row.incoming)}` : '0'}</td>
              <td class="n ${minCls}">${row.threshold ? fmt(row.threshold) : '0'}</td>
              <td>
                ${row.incoming > 0 ? '<span class="chip incoming">PO Active</span>' : ''}
                ${row.isUnmatched ? '<span class="chip unmatched">Not Stocked</span>' : ''}
              </td>
            ` : ''}
          </tr>
          <tr class="jobs" id="drill-${idx}" style="display:none">
            <td colspan="${span}">
              <div class="drill">
                <h4>Driving demand — ${row.jobs.length} job(s) for ${esc(row.sku)}</h4>
                <table class="drill-t">
                  <thead>
                    <tr>
                      <th>Job #</th>
                      <th>Job Name</th>
                      <th>Delivery</th>
                      <th>Section</th>
                      <th>On Sheet</th>
                      <th class="n">Qty</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${row.jobs.map(j => `
                      <tr>
                        <td class="mono"><strong>${esc(j.jobNumber || '—')}</strong></td>
                        <td>${esc(j.jobName || '—')}</td>
                        <td>${esc(j.deliveryDate || '—')}</td>
                        <td>${esc(j.section || 'Hangers')}</td>
                        <td class="mono">${j.sourceSku
                          ? `<span class="chip unmatched" title="The material sheet says ${esc(j.sourceSku)}; we stock ${esc(row.sku)} in its place.">${esc(j.sourceSku)}</span>`
                          : '<span class="zero-ink">—</span>'}</td>
                        <td class="n"><strong>${fmt(j.qty)}</strong></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
          ${hasStock ? `<p class="sub" style="font-size:13px;margin-top:6px">Incoming is shown, never subtracted — whether an open order lands in time is your call, not the tool's.</p>` : ''}
        </div>
      `;
    } else {
      html += `<div class="note ok">All requested hangers are fully covered by available inventory.</div>`;
    }

    // Covered in Stock — only meaningful with a stock file.
    if (hasStock && p.covered.length > 0) {
      html += `
        <details class="sec">
          <summary>Covered in Stock (${p.covered.length} SKUs)</summary>
          <div class="tw" style="margin-top:10px">
            <table>
              <thead>
                <tr>
                  <th>SKU</th>
                  <th class="n">Demanded</th>
                  <th class="n">Available</th>
                  <th class="n">Remaining</th>
                  <th class="n">On PO</th>
                </tr>
              </thead>
              <tbody>
                ${p.covered.map(r => `
                  <tr>
                    <td class="mono"><strong>${esc(r.sku)}</strong> <span class="chip covered">Covered</span></td>
                    <td class="n">${fmt(r.demand)}</td>
                    <td class="n">${fmt(r.available)}</td>
                    <td class="n"><strong>${fmt(r.available - r.demand)}</strong></td>
                    <td class="n ${r.incoming ? '' : 'zero-ink'}">${r.incoming ? `+${fmt(r.incoming)}` : '0'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    }

    // Included jobs.
    if (p.jobs.length > 0) {
      html += `
        <details class="sec">
          <summary>Included Jobs (${p.jobs.length} files)</summary>
          <div class="tw" style="margin-top:10px">
            <table>
              <thead>
                <tr>
                  <th>Job #</th>
                  <th>Job Name</th>
                  <th>Delivery</th>
                  <th>Category</th>
                  <th class="n">Hanger Lines</th>
                </tr>
              </thead>
              <tbody>
                ${p.jobs.map(j => `
                  <tr>
                    <td class="mono"><strong>${esc(j.jobNumber || '—')}</strong></td>
                    <td>${esc(j.jobName || '—')}</td>
                    <td>${esc(j.deliveryDate || '—')}</td>
                    <td>${esc(j.category || '—')}</td>
                    <td class="n">${fmt(j.lines ? j.lines.length : 0)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </details>
      `;
    }

    out.innerHTML = html;

    // Drill-down toggles.
    function setDrill(caret, open) {
      const drill = el(`drill-${caret.dataset.toggle}`);
      if (!drill) return;
      drill.style.display = open ? 'table-row' : 'none';
      caret.textContent = open ? '▾' : '▸';
    }

    out.querySelectorAll('.caret').forEach((caret) => {
      caret.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = el(`drill-${caret.dataset.toggle}`)?.style.display !== 'none';
        setDrill(caret, !isOpen);
      });
    });

    const btnToggleDrills = el('btn-toggle-drills');
    if (btnToggleDrills) {
      btnToggleDrills.addEventListener('click', () => {
        const carets = [...out.querySelectorAll('.caret')];
        const expanding = btnToggleDrills.textContent.trim() === 'Expand all';
        carets.forEach((caret) => setDrill(caret, expanding));
        btnToggleDrills.textContent = expanding ? 'Collapse all' : 'Expand all';
      });
    }
  }
})();
</script>
</body>
</html>
